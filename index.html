<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Бизнес-игра и психотест для подростков: смешные кейсы про звёзд, блогеров и школьные стартапы, 21 психотип с персонажами, ачивки. От одного игрока и больше.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Хайп или Банкрот</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a trading floor for teen founders. One column under a live quote tape; every answer moves a "stock" (the player), every card is a stamped deal, the timer counts down to bankruptcy. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#141a26; --muted:#5b6578; --line:#d6dce7;
  --deadline:#e2322b; --deadline-soft:#fde6e4; --truth:#2f5bea; --truth-soft:#e3eafe;
  --marker:#ffd84d; --marker-ink:#2b2200; --ok:#17885c; --ok-soft:#dcf3e9; --warn:#c77a00; --bad-soft:#fde6e4;
  --p1:#2f5bea; --p2:#d6336c; --p3:#c77a00; --p4:#17885c; --p5:#7b4ddb; --p6:#0e8a9e; --p7:#b5481c; --p8:#5c6b1f;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --radius:10px; --tape-up:#58e0a3; --tape-dn:#ff8a84;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --surface:#171d29; --surface-2:#1d2433; --ink:#e8ecf4; --muted:#9aa5b8; --line:#2b3447;
  --deadline:#ff5a52; --deadline-soft:#3a1b1c; --truth:#7393ff; --truth-soft:#1c2647;
  --marker:#ffd84d; --marker-ink:#2b2200; --ok:#3ccf91; --ok-soft:#16352a; --warn:#f2b33d; --bad-soft:#3a1b1c;
  --p1:#7393ff; --p2:#ff6f9c; --p3:#f2b33d; --p4:#3ccf91; --p5:#ad8bff; --p6:#4fd0e3; --p7:#ff8a5b; --p8:#b9d35a; --tape-up:#0f7a4c; --tape-dn:#c42a23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171d29; --surface-2:#1d2433; --ink:#e8ecf4; --muted:#9aa5b8; --line:#2b3447;
  --deadline:#ff5a52; --deadline-soft:#3a1b1c; --truth:#7393ff; --truth-soft:#1c2647;
  --marker:#ffd84d; --marker-ink:#2b2200; --ok:#3ccf91; --ok-soft:#16352a; --warn:#f2b33d; --bad-soft:#3a1b1c;
  --p1:#7393ff; --p2:#ff6f9c; --p3:#f2b33d; --p4:#3ccf91; --p5:#ad8bff; --p6:#4fd0e3; --p7:#ff8a5b; --p8:#b9d35a; --tape-up:#0f7a4c; --tape-dn:#c42a23; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--truth);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo .or{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted)}
.logo .dl{color:var(--deadline)}
.logo .hp{background:var(--marker);color:var(--marker-ink);padding:0 6px;border-radius:4px}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.round-pill{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
.team-btn{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-weight:600}
.team-btn:hover{border-color:var(--ink)}

/* buttons */
.btn{border:0;border-radius:8px;padding:12px 20px;font-weight:600;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.big{padding:16px 26px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h2{font-size:20px;margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-head h2{margin:0}

/* hero */
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px 4px}
.hero h1{font-size:clamp(30px,6.4vw,52px);font-weight:800;letter-spacing:-.02em}
.hero h1 .dl{color:var(--deadline);white-space:nowrap}
.hero h1 .tr{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 90%,transparent 90%)}
.hero p{margin:0;max-width:58ch;color:var(--muted);font-size:17px}

/* team editor */
.players{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:10px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--pc)}
.prow input,.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.prow .pts{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:56px;text-align:right}
.icon-btn{width:40px;height:40px;flex:none;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1}
.icon-btn:hover:not(:disabled){color:var(--deadline);border-color:var(--deadline)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.addrow{display:flex;gap:10px;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:18px}
.settings > div{display:flex;flex-direction:column;gap:8px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 22px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;font-size:15px}
.rules b{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:46px;padding-top:2px}
.err{color:var(--deadline);font-size:14px;min-height:21px;margin:8px 0 0}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}

/* ticket card */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.ticket::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--kind)}
.ticket.k-dl{--kind:var(--deadline);--kind-soft:var(--deadline-soft)}
.ticket.k-tr{--kind:var(--truth);--kind-soft:var(--truth-soft)}
.t-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px 12px 24px;border-bottom:1px dashed var(--line);font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.t-head .kind{color:var(--kind);font-weight:700;letter-spacing:.06em}
.t-body{padding:18px 22px 20px 24px;display:flex;flex-direction:column;gap:10px}
.t-body .q{font-size:clamp(20px,3.6vw,27px);font-weight:600;line-height:1.3;text-wrap:pretty}
.t-body .hint{font-size:14px;color:var(--muted)}
.tag{display:inline-block;background:var(--kind-soft);color:var(--kind);border-radius:4px;padding:1px 7px;font-weight:700}

/* handoff */
.handoff{display:flex;flex-direction:column;gap:14px;padding-block:30px}
.handoff .who{font-size:clamp(34px,7vw,56px);font-weight:800;color:var(--pc);overflow-wrap:anywhere}
.handoff p{margin:0;font-size:18px;color:var(--muted);max-width:50ch}
.toast{align-self:flex-start;font-size:14px;border-radius:6px;padding:6px 12px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.toast.bad{background:var(--bad-soft);color:var(--deadline)}

/* answer */
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--tc)}
.clock small{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.track{flex:1;min-width:160px;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:var(--tc);transform-origin:left;transition:background .3s}
.t-calm{--tc:var(--ok)} .t-warn{--tc:var(--warn)} .t-panic{--tc:var(--deadline)}
.t-panic .clock{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.55}}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;font-size:18px;line-height:1.45}
textarea:focus{border-color:var(--pc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 25%,transparent)}
.answer-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.flash{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--deadline) 88%,transparent);color:#fff;z-index:20;font-family:var(--f-display);font-weight:800;font-size:clamp(40px,11vw,96px);letter-spacing:-.02em;animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(1.08)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* results */
.results{display:flex;flex-direction:column;gap:12px}
.res{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.res-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.res-name{font-weight:700;font-size:18px;color:var(--pc)}
.res-pts{font-family:var(--f-mono);font-weight:700;font-size:22px}
.crown{font-family:var(--f-mono);font-size:12px;background:var(--marker);color:var(--marker-ink);border-radius:4px;padding:2px 7px;margin-left:8px;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.res blockquote{margin:0;font-size:17px;padding-left:12px;border-left:2px solid var(--line);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12.5px;border-radius:5px;padding:3px 8px;background:var(--surface-2);color:var(--muted)}
.chip.plus{background:var(--ok-soft);color:var(--ok)} .chip.minus{background:var(--bad-soft);color:var(--deadline)}
.verdict{font-size:15px;font-weight:600}

/* scoreboard */
.board{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:26px minmax(70px,140px) 1fr 90px 44px 52px;align-items:center;gap:12px}
.brow .pl{font-family:var(--f-mono);color:var(--muted)}
.brow .nm{font-weight:600;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bar{height:12px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--pc);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.brow .sc{font-family:var(--f-mono);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* final */
.podium{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));align-items:end;gap:10px;max-width:calc(var(--cols) * 240px)}
.step{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:var(--radius);padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.step .place{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.step .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(16px,3.4vw,22px);color:var(--pc);overflow-wrap:anywhere}
.step .sc{font-family:var(--f-mono);font-weight:700;font-size:20px}
.step .ttl{font-size:13px;color:var(--muted)}
.podium.n3 .p1{order:2} .podium.n3 .p2{order:1} .podium.n3 .p3{order:3}
.step.p1{min-height:190px} .step.p2{min-height:160px} .step.p3{min-height:135px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
.modes button{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer}
.modes button span{font-size:13.5px;color:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.trait-line{font-size:14.5px;border-left:3px solid var(--tc);padding-left:10px}
.trait-line .ti{font-size:16px}
.psy{display:flex;flex-direction:column;gap:14px}
.psy-h{font-family:var(--f-display,inherit);font-size:22px;margin:4px 0 0}
.ptype{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;animation:pt-in .5s ease both}
.ptype:nth-child(3){animation-delay:.12s}.ptype:nth-child(4){animation-delay:.24s}.ptype:nth-child(5){animation-delay:.36s}
@keyframes pt-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ptype{animation:none}}
.pt-row{display:flex;gap:16px;align-items:center;padding-right:110px}
@media (max-width:480px){.pt-row{padding-right:0;padding-top:22px}}

.ptype h3{margin:2px 0;font-size:24px;color:var(--tc)}
.ptype p{margin:0;line-height:1.5}
.pt-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;line-height:1.45}
.pbars{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pbar{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;font-size:13.5px}
.pbar b{font-family:var(--f-mono);text-align:right}
.pbar>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptrack{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}.ptrack div{height:100%;border-radius:4px}
@media (max-width:480px){.pbar{grid-template-columns:132px 1fr 36px;gap:8px;font-size:12px}}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.badge{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.badge>span{grid-row:span 2;font-size:22px}.badge b{font-size:13.5px}.badge small{font-size:12px;color:var(--muted)}
.chem p{margin:8px 0 0;line-height:1.5}
.memo{background:var(--marker);color:var(--marker-ink);border-radius:var(--radius);padding:18px 20px;font-weight:600;font-size:17px}
.others{display:flex;flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;font-size:16px;line-height:1.4;min-width:0}
.opt:hover{border-color:var(--pc);background:var(--surface-2)}
.opt-l{font-family:var(--f-mono);font-weight:700;flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--pc)}
.opt.wild{grid-column:1/-1;border-style:dashed;border-width:2px;background:linear-gradient(110deg,color-mix(in srgb,var(--marker) 22%,var(--surface)),color-mix(in srgb,var(--deadline) 10%,var(--surface)))}
.opt.wild .opt-l{background:var(--marker);color:var(--marker-ink);border-color:transparent;font-size:15px}
.opt.wild:hover{border-color:var(--deadline)}
.or-line{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
/* quote tape: players trade like stocks */
.tape-wrap{overflow:hidden;border-radius:8px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12.5px;line-height:1;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape{display:flex;width:max-content;animation:tape 46s linear infinite}
.tape:hover{animation-play-state:paused}
.tape span{padding:9px 14px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tape b{font-weight:700}
.tape .up{color:var(--tape-up)} .tape .dn{color:var(--tape-dn)}
.tape .me{background:color-mix(in srgb,var(--bg) 12%,transparent)}
@keyframes tape{to{transform:translateX(-50%)}}

/* hero: the wordmark rides a chart that pumps on «Хайп» and crashes on «Банкрот» */
.hero2{position:relative;display:flex;flex-direction:column;gap:16px;padding-block:6px 2px}
.mark{position:relative;display:grid;gap:0;padding:18px 4px 10px;isolation:isolate}
.mark .w{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,12.5vw,104px);line-height:.92;letter-spacing:-.035em;position:relative;z-index:1}
.mark .w-hype{color:var(--ok)}
.mark .w-hype i{font-style:normal;background:var(--marker);color:var(--marker-ink);padding:0 .12em;border-radius:.08em;box-decoration-break:clone}
.mark .w-or{font-family:var(--f-mono);font-size:clamp(13px,2.4vw,16px);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);padding:6px 0 6px 6px;z-index:1}
.mark .w-bank{color:var(--deadline);justify-self:end;text-align:right}
.chart{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart .bull,.chart .bear{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 1.6s cubic-bezier(.3,.7,.2,1) both}
.chart .bull{stroke:var(--ok)} .chart .bear{stroke:var(--deadline);animation-delay:1.1s;animation-duration:.6s}
.chart .area{fill:color-mix(in srgb,var(--ok) 12%,transparent)}
.chart .peak{fill:var(--marker);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
@keyframes draw{from{stroke-dashoffset:1400}}
.hero2 p{margin:0;max-width:60ch;color:var(--muted);font-size:17px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0;padding:0;list-style:none;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.facts li{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.facts b{font-family:var(--f-display);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* stamped deal card */
.stamp{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--kind);border:2.5px solid var(--kind);border-radius:6px;padding:4px 10px 3px;transform:rotate(-3deg);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--kind) 30%,transparent);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.9);opacity:0}}

/* answer tiles */
.opt{transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;box-shadow:0 1px 0 var(--line)}
.opt:hover{transform:translateY(-2px);box-shadow:0 6px 0 -2px color-mix(in srgb,var(--pc) 45%,transparent),0 10px 24px -14px color-mix(in srgb,var(--ink) 60%,transparent)}
.opt:active{transform:translateY(1px) scale(.99)}
.opt-l{background:color-mix(in srgb,var(--pc) 14%,var(--surface));border-color:color-mix(in srgb,var(--pc) 40%,var(--line))}

/* stock moves */
.res-pts{padding:3px 10px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-size:19px}
.res-pts.flat{background:var(--surface-2);color:var(--muted)}
.spark{display:block;width:100%;height:26px;overflow:visible}
.spark polyline{fill:none;stroke:var(--pc);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--pc)}
.brow .dl-pts{font-family:var(--f-mono);font-size:12px;color:var(--ok);text-align:right}
.brow .dl-pts.z{color:var(--muted)}

/* collectible psychotype cards */
.ptype{padding:0;overflow:hidden;border-top:0;transition:transform .2s ease}
.ptype:hover{transform:translateY(-3px) rotate(-.3deg)}
.pt-head{background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 22%,var(--surface)),color-mix(in srgb,var(--tc) 6%,var(--surface)));padding:18px 20px;border-bottom:1px solid color-mix(in srgb,var(--tc) 35%,var(--line));position:relative}
.pt-icon{width:64px;height:64px;flex:none;display:grid;place-items:center;font-size:36px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 55%,transparent)}
.rarity{position:absolute;top:12px;right:14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,var(--line))}
.pt-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
.modes button{padding:16px;gap:6px;transition:transform .14s ease}
.modes button:hover{transform:translateY(-2px)}
.modes .mi{font-size:28px;line-height:1}
.modes button b{font-family:var(--f-display);font-size:17px}
.tape .z{opacity:.6}
.pt-art{flex:none;display:block;line-height:0;border-radius:50%;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--tc) 35%,transparent))}
.pt-head{background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 24%,var(--surface)),color-mix(in srgb,var(--tc2,var(--tc)) 16%,var(--surface)))}
.hy-mix{display:inline-block;margin-top:6px;font-size:12.5px;font-family:var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.cast{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.cast .ava{width:100%;height:auto;max-width:118px;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.cast figure:hover .ava{transform:translateY(-4px) rotate(-4deg)}
.cast figcaption{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);line-height:1.3}
.cast figcaption b{font-size:13.5px;color:var(--ink)}
@media (max-width:640px){.cast{grid-template-columns:repeat(3,minmax(0,1fr))}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.exit-btn{color:var(--deadline)}
.exit-btn:hover{border-color:var(--deadline)}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 45%,transparent);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h2{font-size:20px}
.dialog p{margin:0}
@media (max-width:520px){
  .brow{grid-template-columns:22px minmax(60px,96px) 1fr 44px;gap:8px}
  .brow .sp,.brow .dl-pts{display:none}
  .clock{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  parts.push(["Объём", n<=2?1 : n<=5?4 : n<=15?8 : n<=30?10 : 7]);
  if (n >= 4) parts.push(["Разнообразие", Math.round(new Set(ws).size / n * 6)]);
  const rich = new Set(ws.filter(w => w.length >= 9)).size;
  if (rich) parts.push(["Сочные слова", Math.min(4, rich)]);
  let emo = 0;
  if (/!/.test(text)) emo++; if (/\?/.test(text)) emo++; if (/…|\.\.\./.test(text)) emo++;
  if (/\p{Extended_Pictographic}/u.test(text)) emo++;
  if ((text.match(/[A-ZА-ЯЁ]{3,}/g)||[]).length) emo++;
  if (/[«"].+[»"]/.test(text)) emo++;
  if (emo) parts.push(["Эмоции", Math.min(4, emo)]);
  const cardWs = new Set(words(card[1]));
  const own = ws.filter(w => !cardWs.has(w));           // words the player wrote, not copied from the card
  const copied = n >= 3 && (n - own.length) / n > 0.6;
  const topic = card[2].filter(s => hasStem(own, s)).length;
  if (topic) parts.push(["По теме", Math.min(4, topic*2)]);
  const corp = CORP.filter(s => hasStem(own, s)).length;
  if (corp) parts.push(["Бизнес-словарь", Math.min(6, corp*2)]);
  if (!timedOut && n >= 4 && !copied) {
    let sp = Math.round((limit - elapsed) / limit * 5);
    if (card[0] === "dl") sp *= 2;
    if (sp) parts.push([card[0] === "dl" ? "Скорость ×2" : "Скорость", sp]);
  }
  if (timedOut) parts.push(["Дедлайн сорван", -3]);
  if (copied) parts.push(["Переписал(а) вопрос", -8]);
  const mine = new Set(ws); let worst = 0;
  for (const o of others) {
    const os = new Set(words(o)); if (!os.size) continue;
    const inter = [...mine].filter(w => os.has(w)).length;
    worst = Math.max(worst, inter / new Set([...mine, ...os]).size);
  }
  if (worst >= 0.5) parts.push(["Похоже на соседа", -Math.round(worst*8)]);
  parts.push(["Настроение босса", Math.floor(Math.random()*3)]);
  const total = Math.max(0, parts.reduce((s,p) => s + p[1], 0));
  const verdict = total>=30 ? "Гениально! Инвесторы уже звонят." : total>=22 ? "Сильно. Совет директоров аплодирует."
    : total>=15 ? "Достойно. Можно в презентацию." : total>=8 ? "Неплохо, но нужно больше синергии." : "Давайте обсудим это на следующем созвоне.";
  return { total, parts, verdict };
}

// «Ва-банк»: смешная идея из чужого кейса (чаще всего «креативный» вариант), а рынок бросает кубик
function wildIdea(c){
  for (let i = 0; i < 20; i++) {
    const o = CARDS[Math.floor(Math.random() * CARDS.length)];
    if (o === c) continue;
    const k = Math.random() < .6 ? 1 : Math.floor(Math.random() * 4);
    return o[3][k];
  }
  return c[3][1];
}
function scoreWild(card, elapsed, limit){
  const roll = Math.random(), parts = [];
  let verdict;
  if (roll < .4) { parts.push(["🎲 Ва-банк: ХАЙП!", 18 + Math.floor(Math.random()*8)]); verdict = "🚀 Рынок сошёл с ума — идея выстрелила!"; }
  else if (roll < .75) { parts.push(["🎲 Ва-банк: рынок не понял", 4 + Math.floor(Math.random()*5)]); verdict = "🤷 Странно, но кто-то купил."; }
  else { parts.push(["🎲 Ва-банк: БАНКРОТ", 0]); verdict = "💥 Банкрот. Зато какая история!"; }
  if (parts[0][1]) { let sp = Math.round((limit - elapsed) / limit * 3); if (card[0] === "dl") sp *= 2; if (sp) parts.push([card[0]==="dl" ? "Скорость ×2" : "Скорость", sp]); }
  const total = parts.reduce((s,p) => s + p[1], 0);
  return { total, parts, verdict, crash: !parts[0][1] };
}
const TIERS = [["Сильный ход",12],["Креатив",10],["Рабочий вариант",8],["Осторожно",4]];
function scoreChoice(k, card, sameCount, elapsed, timedOut, limit){
  const [tier, pts] = TIERS[k], parts = [[tier, pts]];
  if (!timedOut) { let sp = Math.round((limit - elapsed) / limit * 3); if (card[0] === "dl") sp *= 2; if (sp) parts.push([card[0]==="dl" ? "Скорость ×2" : "Скорость", sp]); }
  if (sameCount > 1) parts.push(["Мейнстрим: такой же выбор у других", -3]);
  parts.push(["Настроение босса", Math.floor(Math.random()*3)]);
  const total = Math.max(0, parts.reduce((s,p) => s + p[1], 0));
  const verdict = k === 0 ? "Сильный ход! Рынок в восторге." : k === 3 ? "Слишком осторожно для звёздного бизнеса." : "Неплохо, но рынок ждал чего-то посмелее.";
  return { total, parts, verdict };
}

function spark(hist){
  const h = (hist && hist.length > 1) ? hist : [0, ...(hist || [0])];
  const max = Math.max(1, ...h), W = 100, H = 24, step = W / (h.length - 1);
  const pts = h.map((v,i) => `${(i*step).toFixed(1)},${(H - v/max*H).toFixed(1)}`);
  const [lx, ly] = pts[pts.length-1].split(",");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts.join(" ")}"/><circle cx="${lx}" cy="${ly}" r="2.6"/></svg>`;
}
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv);
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = ["--ok","--deadline","--marker","--truth","--p2","--p5"].map(v => css.getPropertyValue(v).trim());
  const P = Array.from({length:150}, () => ({ x:W/2 + (Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-4,
    s:5+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[Math.floor(Math.random()*cols.length)], m:Math.random()<.5 }));
  let t0 = performance.now();
  (function frame(now){
    const t = (now - t0)/1000; g.clearRect(0,0,W,H);
    P.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - t/3.2); g.fillStyle = p.c;
      if (p.m) g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else { g.font = `${p.s*2}px sans-serif`; g.fillText(Math.random()<.5?"₸":"$",0,0); }
      g.restore(); });
    if (t < 3.2) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

      S.players.forEach(p => { p.score = 0; p.traits = {}; p.stats = null; p.hist = [0]; p.delta = 0; });
      S.deck = shuffle(CARDS); S.round = 1; S.played = 0; S.ticket = Math.floor(Math.random()*800); startRound();
    };
  }};
}
const plural = (n, f) => f[(n%10===1 && n%100!==11) ? 0 : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 1 : 2];

function team(){
  return { html: `
  <section class="panel"><div class="panel-head"><h2>Команда</h2><span class="label">Раунд ${S.round} / ${S.rounds}</span></div>
    ${S.teamMsg ? `<p class="toast" style="margin:0 0 12px">${esc(S.teamMsg)}</p>` : ""}
    ${teamEditorHtml(true)}
    <p class="note">Новые игроки начинают с нуля и отвечают со следующего раунда. Если убрать игрока посреди раунда, его ход пропускается.</p>
    <div class="row" style="margin-top:16px"><button class="btn big" id="done">Вернуться к игре →</button></div>
  </section>`,
  bind(){
    bindTeamEditor(() => render());
    document.getElementById("done").onclick = () => {
      cleanNames();
      const names = S.players.map(p => p.name.toLowerCase());
      if (new Set(names).size !== names.length) { document.getElementById("err").textContent = "Имена повторяются: добавьте фамилию или должность."; return; }
      S.teamMsg = "";
      // If the round's remaining players were all removed, score what we have.
      if ((S.back === "handoff" || S.back === "intro") && S.turn >= S.order.length) return scoreRound();
      S.screen = S.back || "intro"; render();
    };
  }};
}

function startRound(){
  const ids = S.players.map(p => p.id), n = ids.length, first = (S.round-1) % n;
  S.order = Array.from({length:n}, (_,k) => ids[(first+k) % n]);
  S.turn = 0; S.answers = {}; S.last = null; S.ticket++; S.optOrder = shuffle([0,1,2,3]);
  S.screen = "intro"; render();
}

function intro(){
  const solo = S.order.length === 1;
  return { html: `${ticketHtml()}
  <section class="panel"><h2>${solo ? "Ваш ход" : "Порядок ответов"}</h2>
    <div class="row">${S.order.map((id,k)=>{ const p = byId(id); return `<span style="color:${col(p)};font-weight:700">${esc(p.name)}</span>${k<S.order.length-1?'<span class="muted">→</span>':""}`; }).join(" ")}</div>
    <p class="muted" style="margin:12px 0 16px">${S.mode === "test" ? "Без таймера: отвечайте честно, правильных ответов нет." : solo ? "Таймер запустится, когда вы будете готовы." : "Ответы остальных откроются только в конце раунда."}</p>
    <button class="btn big" id="go">${solo ? "Я готов(а) →" : "Передать первому игроку →"}</button></section>`,
  bind(){ document.getElementById("go").onclick = () => { S.screen = solo ? "answer" : "handoff"; render(); }; } };
}

function handoff(){
  const p = byId(S.order[S.turn]);
  const t = S.last ? (S.last.timedOut
      ? `<span class="toast bad">${esc(S.last.name)}: дедлайн сорван, отправлено то, что успели</span>`
      : `<span class="toast">Ответ игрока ${esc(S.last.name)} принят за ${S.last.elapsed.toFixed(1)} с</span>`) : "";
  const others = S.order.length > 1;
  return { html: `<section class="handoff" style="--pc:${col(p)}">${t}
    <span class="label">${others ? "Передайте устройство" : "Ваш ход"}</span>
    <div class="who">${esc(p.name)}</div>
    <p>${others ? "Остальные — отвернитесь от экрана. " : ""}${S.mode === "test" ? "Отвечайте честно — таймера нет." : `Таймер на ${S.limit} секунд запустится, как только вы нажмёте кнопку.`}</p>
    <div><button class="btn big" id="ready">Я готов(а), показать задачу</button></div></section>`,
  bind(){ const b = document.getElementById("ready"); b.focus(); b.onclick = () => { S.screen="answer"; render(); }; } };
}

function answer(){
  const p = byId(S.order[S.turn]), c = card(), L = "ABCD";
  const order = S.optOrder || [0,1,2,3];
  return { html: `${ticketHtml()}
  ${S.mode === "test" ? "" : `<section class="timer t-calm" id="timer"><div class="clock"><small>До банкротства</small><span id="clock">00:${String(S.limit).padStart(2,"0")}</span></div>
    <div class="track"><div class="fill" id="fill"></div></div></section>`}
  <section style="--pc:${col(p)};display:flex;flex-direction:column;gap:12px">
    <span class="label" style="color:${col(p)}">Ответ: ${esc(p.name)} · выберите вариант или рискните</span>
    <div class="opts">${order.map((k,j)=>`<button class="opt" data-k="${k}"><span class="opt-l">${L[j]}</span><span>${esc(c[3][k])}</span></button>`).join("")}</div>
    <button class="opt wild" id="wild"><span class="opt-l">🎲</span><span><b>Ва-банк</b> — вслепую взять безумную идею из другого кейса. ${S.mode === "test" ? "Для тех, кто живёт на грани." : "Рынок решит: +25, пара очков или банкрот."}</span></button>
    <div class="answer-foot"><span class="muted" style="font-size:14px">Клавиши: 1–4 — вариант · 5 — ва-банк</span></div></section>`,
  bind(){
    const clock = document.getElementById("clock"), fill = document.getElementById("fill"), box = document.getElementById("timer");
    const first = document.querySelector(".opt"); if (first) first.focus();
    let t0 = performance.now(), pausedAt = 0;
    const limit = S.limit;
    let done = false;
    const finish = (timedOut, opt = null, wild = false) => {
      if (done) return; done = true; clearInterval(timer);
      const elapsed = timedOut ? limit : (performance.now()-t0)/1000;
      const text = wild ? wildIdea(c) : opt === null ? "" : c[3][opt];
      S.answers[p.id] = { text, elapsed, timedOut: timedOut && opt === null && !wild, opt, wild };
      S.last = { name: p.name, elapsed, timedOut };
      const next = () => { S.turn++; if (S.turn < S.order.length) { S.screen="handoff"; render(); } else scoreRound(); };
      if (timedOut) { const f = document.createElement("div"); f.className="flash"; f.textContent="ДЕДЛАЙН!"; document.body.appendChild(f); setTimeout(()=>{ f.remove(); next(); }, 900); }
      else next();
    };
    const tick = () => {
      const left = Math.max(0, limit - (performance.now()-t0)/1000), frac = left/limit;
      clock.textContent = "00:" + String(Math.ceil(left)).padStart(2,"0");
      fill.style.transform = `scaleX(${frac})`;
      box.className = "timer " + (frac>0.5 ? "t-calm" : frac>0.2 ? "t-warn" : "t-panic");
      if (left <= 0) finish(true);
    };
    if (S.mode === "test") { timerCtl = { pause(){}, resume(){} }; }
    else { timer = setInterval(tick, 100); tick(); }
    if (S.mode !== "test") timerCtl = {
      pause(){ if (!pausedAt) { pausedAt = performance.now(); clearInterval(timer); } },
      resume(){ if (pausedAt) { t0 += performance.now() - pausedAt; pausedAt = 0; timer = setInterval(tick, 100); tick(); } },
    };
    document.querySelectorAll(".opt[data-k]").forEach(b => b.onclick = () => finish(false, +b.dataset.k));
    document.getElementById("wild").onclick = () => finish(false, null, true);
    const keyPick = e => {
      if (done || document.getElementById("exitdlg")) return;
      const j = "1234".indexOf(e.key); if (j >= 0) { e.preventDefault(); finish(false, order[j]); }
      if (e.key === "5") { e.preventDefault(); finish(false, null, true); }
    };
    document.addEventListener("keydown", keyPick);
    const stop = () => document.removeEventListener("keydown", keyPick);
    const _finish = finish; // detach the shortcut once the answer is in
    document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", stop));
    document.getElementById("wild").addEventListener("click", stop);
    keyCleanup = stop;
  }};
}

function scoreRound(){
  const c = card(), ids = S.order.filter(id => S.answers[id] && byId(id));
  S.results = ids.map(id => {
    const a = S.answers[id];
    const r = a.wild ? scoreWild(c, a.elapsed, S.limit)
      : (a.opt !== null && a.opt !== undefined)
      ? scoreChoice(a.opt, c, ids.filter(j => S.answers[j].opt === a.opt).length, a.elapsed, a.timedOut, S.limit)
      : score(a.text, c, ids.filter(j => j !== id && (S.answers[j].opt === null || S.answers[j].opt === undefined)).map(j => S.answers[j].text), a.elapsed, a.timedOut, S.limit);
    const p = byId(id), tags = autoTags(c);
    const trait = a.wild ? "X" : (a.opt !== null && a.opt !== undefined) ? tags[a.opt] : null;
    p.traits = p.traits || {};
    if (trait) p.traits[trait] = (p.traits[trait] || 0) + typeWeight(trait);
    if (S.mode !== "test") { p.score += r.total; p.delta = r.total; }
    const st = p.stats = p.stats || { wild:0, crash:0, opts:0, fast:99, late:0, wins:0, n:0 };
    st.n++; if (a.wild) { st.wild = (st.wild||0) + 1; if (r.crash) st.crash = (st.crash||0) + 1; } else if (a.opt !== null && a.opt !== undefined) st.opts++;
    if (a.timedOut) st.late++; else if (a.text) st.fast = Math.min(st.fast, a.elapsed);
    return { id, text:a.text, opt:a.opt, wild:!!a.wild, trait, ...r };
  });
  if (S.mode !== "test" && S.results.length > 1) {
    const top = Math.max(...S.results.map(r => r.total));
    if (top > 0) S.results.filter(r => r.total === top).forEach(r => { const p = byId(r.id); if (p && p.stats) p.stats.wins++; });
  }
  S.players.forEach(p => { p.hist = p.hist || [0]; p.hist.push(p.score); if (!S.results.some(r => r.id === p.id)) p.delta = 0; });
  S.played = S.round;
  S.screen = "results"; render();
}

function results(){
  const best = Math.max(0, ...S.results.map(r=>r.total));
  const last = S.round >= S.rounds, solo = S.results.length === 1;
  return { html: `${ticketHtml()}
  <section class="results"><h2 style="font-size:20px">${solo ? "Ваш ответ" : "Ответы раунда"}</h2>${S.results.length ? S.results.map(r=>{ const p = byId(r.id) || {id:r.id,name:"—"}; return `
    <article class="res" style="--pc:${col(p)}">
      <div class="res-head"><span class="res-name">${esc(p.name)}${S.mode !== "test" && !solo && r.total===best && best>0 ? '<span class="crown">ЛУЧШИЙ ОТВЕТ</span>' : ""}</span>${S.mode === "test" ? "" : `<span class="res-pts ${r.total ? "" : "flat"}">${r.total ? "▲ +" + r.total : "▬ 0"}</span>`}</div>
      <blockquote>${r.wild ? `<span class="label">🎲 Ва-банк</span><br>` : r.opt !== null && r.opt !== undefined ? `<span class="label">Вариант ${"ABCD"[(S.optOrder||[0,1,2,3]).indexOf(r.opt)]}</span><br>` : ""}${r.text ? esc(r.text) : '<span class="muted">…ничего не успел(а) написать</span>'}</blockquote>
      ${S.mode === "test" ? "" : `<div class="chips">${r.parts.map(([n,pt])=>`<span class="chip ${pt>0?"plus":pt<0?"minus":""}">${esc(n)} ${pt>0?"+"+pt:pt}</span>`).join("")}</div>
      <div class="verdict">${esc(r.verdict)}</div>`}
      ${r.trait ? `<div class="trait-line" style="--tc:${TYPES[r.trait].c}"><span class="ti">${TYPES[r.trait].icon}</span> Так ответил бы <b>${TYPES[r.trait].name}</b> <span class="muted">${TYPES[r.trait].nick}</span></div>` : ""}</article>`; }).join("") : `<p class="muted">В этом раунде никто не ответил.</p>`}</section>
  ${S.mode === "test" ? "" : boardHtml(solo && S.players.length === 1 ? "Ваша котировка" : "Биржа игроков")}
  <div><button class="btn big" id="next">${last ? (S.mode === "test" ? "Узнать свой психотип →" : "Подвести итоги →") : "Следующий вопрос →"}</button></div>`,
  bind(){ document.getElementById("next").onclick = () => { if (last) { S.screen="final"; render(); } else { S.round++; startRound(); } }; } };
}

// ачивки: смешные значки по тому, КАК человек играл
function badges(p){
  const st = p.stats || {}, tr = p.traits || {}, out = [];
  const kinds = TYPE_KEYS.filter(k => tr[k]).length, n = st.n || 0;
  if (S.mode !== "test" && st.fast <= 5) out.push(["⚡","Спидраннер","ответ быстрее 5 секунд"]);
  if ((st.wild||0) >= 2) out.push(["🎲","Азартный игрок","ва-банк " + st.wild + " раз(а)"]);
  if ((st.crash||0) >= 2) out.push(["💥","Серийный банкрот","прогорел(а) на ва-банке " + st.crash + " раза"]);
  if (n >= 4 && !st.wild) out.push(["🤖","Режим NPC","ни разу не рискнул(а)"]);
  if (st.wins >= 2) out.push(["👑","Главный герой","лучший ответ раунда " + st.wins + " раза"]);
  if (st.late) out.push(["🐌","Прокрастинатор","дедлайн сорван " + st.late + " раз(а)"]);
  if (kinds >= 4) out.push(["🦎","Хамелеон","4+ разных психотипа"]);
  if (n >= 4 && kinds === 1) out.push(["🗿","Скала","один психотип во всех ответах"]);
  if ((tr.X || 0) >= 3 * typeWeight("X")) out.push(["🎲","Генератор хаоса","3+ безумных решения"]);
  if ((tr.S || 0) >= 3 * typeWeight("S")) out.push(["💸","Бизнес-кабан","3+ раза выбрал(а) деньги"]);
  if ((tr.D || 0) >= 3 * typeWeight("D")) out.push(["🕊️","Миротворец","3+ раза всех помирил(а)"]);
  return out;
}

function psychHtml(){
  const ps = S.players.filter(p => dominant(p));
  if (!ps.length) return "";
  const cards = ps.map(p => {
    const d = dominant(p), T = TYPES[d.key], tr = p.traits;
    const bars = TYPE_KEYS.filter(k => tr[k]).sort((a,b) => tr[b]-tr[a]).map(k => {
      const pct = Math.round(tr[k] / d.total * 100);
      return `<div class="pbar"><span>${TYPES[k].icon} ${TYPES[k].name}</span><div class="ptrack"><div style="width:${pct}%;background:${TYPES[k].c}"></div></div><b>${pct}%</b></div>`;
    }).join("");
    const w = typeWeight(d.key), Hy = d.second ? hybridOf(d.key, d.second) : null;
    const rar = Hy ? "Гибрид" : w >= 1.5 ? "Легендарная карта" : w >= 1 ? "Редкая карта" : "Классика";
    const T2 = d.second ? TYPES[d.second] : T;
    return `<article class="ptype" style="--tc:${T.c};--tc2:${T2.c};--pc:${col(p)}">
      <div class="pt-head"><span class="rarity">${rar}</span><div class="pt-row"><span class="pt-art">${avatar(d.key, d.second || d.key, p.id)}</span><div><span class="label" style="color:${col(p)}">${esc(p.name)}</span><h3>${Hy ? Hy.name : T.name}</h3><span class="muted">${Hy ? Hy.nick : T.nick}</span>${Hy ? `<span class="hy-mix">${T.icon} ${T.name} + ${T2.icon} ${T2.name}</span>` : ""}</div></div></div><div class="pt-body">
      <p>${Hy ? Hy.desc : T.desc}</p>
      <ul class="pt-list"><li><b>Суперсила:</b> ${T.plus}</li><li><b>Слабое место:</b> ${T.minus}</li><li><b>Совет:</b> ${T.tip}</li></ul>
      <div class="pbars">${bars}</div>
      ${badges(p).length ? `<div class="badges">${badges(p).map(([i,n,w]) => `<span class="badge" title="${w}"><span>${i}</span><b>${n}</b><small>${w}</small></span>`).join("")}</div>` : ""}</div></article>`;
  }).join("");
  let chem = "";
  if (ps.length >= 2) {
    const pairs = [];
    for (let i = 0; i < ps.length; i++) for (let j = i+1; j < ps.length; j++) {
      const a = dominant(ps[i]).key, b = dominant(ps[j]).key;
      // разные типы дополняют друг друга лучше, чем одинаковые
      pairs.push({ a: ps[i], b: ps[j], s: (a === b ? 0 : 2) + ((a+b).match(/C/) && (a+b).match(/[VX]/) ? 1 : 0) + Math.random(), text: pairText(a, b) });
    }
    pairs.sort((x,y) => y.s - x.s);
    const best = pairs[0], worst = pairs.length > 1 ? pairs[pairs.length-1] : null;
    chem = `<section class="panel chem"><h2>Химия команды</h2>
      <p><b>Лучшие сооснователи:</b> <span style="color:${col(best.a)}">${esc(best.a.name)}</span> + <span style="color:${col(best.b)}">${esc(best.b.name)}</span>. ${best.text}</p>
      ${worst ? `<p><b>Пару не сажать в один кабинет:</b> <span style="color:${col(worst.a)}">${esc(worst.a.name)}</span> + <span style="color:${col(worst.b)}">${esc(worst.b.name)}</span>. ${worst.text}</p>` : ""}
    </section>`;
  }
  return `<section class="psy"><h2 class="psy-h">${ps.length === 1 ? "Ваш бизнес-психотип" : "Бизнес-психотипы команды"}</h2>${cards}</section>${chem}`;
}

function final(){
  if (S.mode === "test") return { html: `
  <section class="hero"><span class="label">Психотест · ${S.played} ${plural(S.played,["вопрос","вопроса","вопросов"])}</span><h1>Кто вы в бизнесе?</h1>
  <p class="muted">Результат шуточный, но подозрительно точный.</p></section>
  ${psychHtml() || '<p class="muted">Ответов пока нет — пройдите хотя бы один вопрос.</p>'}
  <div class="row"><button class="btn big" id="again">Пройти ещё раз</button><button class="btn ghost" id="new">Изменить команду</button></div>`,
  bind: finalBind };
  const ps = [...S.players].sort((a,b) => b.score - a.score);
  const top = ps.slice(0, 3), solo = ps.length === 1;
  const winners = ps.filter(p => p.score === ps[0].score).map(p => esc(p.name));
  const R = Math.max(1, S.played);
  const memo = solo ? `${winners[0]}, ваш результат — ${ps[0].score} очков за ${R} ${plural(R,["раунд","раунда","раундов"])}. ${ps[0].score >= R*25 ? "Уровень: совет директоров." : ps[0].score >= R*15 ? "Уровень: руководитель направления." : "Уровень: перспективный стажёр. Попробуйте ещё раз!"}`
    : winners.length > 1 ? `Ничья! ${winners.join(", ")} делят кабинет с видом на парковку.`
    : `${winners[0]} получает переходящий степлер славы и годовой запас печенек.`;
  return { html: `
  <section class="hero"><span class="label">${S.played < S.rounds ? `Итоги после ${S.played} из ${S.rounds} раундов` : "Итоги квартала"}</span><h1>Совещание окончено</h1></section>
  <section class="podium n${top.length}" style="--cols:${top.length}">${top.map((p,k)=>`
    <div class="step p${k+1}" style="--pc:${col(p)}"><span class="place">${solo ? "Ваш итог" : (k+1) + " место"}</span><span class="nm">${esc(p.name)}</span>
    <span class="sc">${p.score} очк.</span><span class="ttl">${TITLES[Math.min(k, TITLES.length-1)]}</span></div>`).join("")}</section>
  ${ps.length > 3 ? `<section class="panel others">${ps.slice(3).map((p,k)=>`<div><b style="color:${col(p)}">${k+4}. ${esc(p.name)}</b> · ${p.score} очк. <span class="muted">— ${TITLES[Math.min(k+3, TITLES.length-1)]}</span></div>`).join("")}</section>` : ""}
  <div class="memo">${memo}</div>
  ${psychHtml()}
  ${solo ? "" : boardHtml()}
  <div class="row"><button class="btn big" id="again">Сыграть ещё раз</button><button class="btn ghost" id="new">Изменить команду</button></div>`,
  bind: finalBind };
}
function finalBind(){
  setTimeout(confetti, 250);
  const reset = () => S.players.forEach(p => { p.score = 0; p.traits = {}; p.stats = null; p.hist = [0]; p.delta = 0; });
  document.getElementById("again").onclick = () => { reset(); S.deck = shuffle(CARDS); S.round = 1; S.played = 0; startRound(); };
  document.getElementById("new").onclick = () => { reset(); S.round = 0; S.order = []; S.played = 0; S.screen = "setup"; render(); };
}

// ───────── boot (keeps a game in progress across page updates) ─────────
function start(data){
  S = data && data.screen && Array.isArray(data.players) && data.players[0] && typeof data.players[0] === "object" ? data : fresh();
  S.mode = S.mode || "game"; S.players.forEach(p => { p.traits = p.traits || {}; p.hist = p.hist || [0, p.score || 0]; });
  if (S.screen === "answer") S.screen = S.order.length > 1 ? "handoff" : "intro"; // restart an interrupted turn with a full timer
  render();
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
